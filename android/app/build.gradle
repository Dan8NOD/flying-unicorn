apply plugin: 'com.android.application'

// The upload key for Google Play never lives in this repo: GitHub Pages publishes all of it.
// A release build is signed only when a properties file outside the repo says where the key is.
// Without that file the bundle comes out unsigned. docs/google-play.md has the steps.
def keystoreProps = new Properties()
def keystorePropsFile = file(System.getenv('PINK_UNICORN_KEYSTORE_PROPERTIES') ?: "${System.getProperty('user.home')}/.pink-unicorn/keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasUploadKey = keystoreProps.getProperty('storeFile') != null

// Google Play Billing (docs/google-play.md, "Purchases"). The billing code is always compiled in, but the shop's paid
// pages stay hidden until a build is made with -PpinkStoreBilling=true. Such a build must carry the app's Play
// licensing key (a public key, safe to keep in gradle.properties): without it no purchase could be checked.
def storeBilling = (findProperty('pinkStoreBilling') ?: 'false').toString().toBoolean()
def playLicenseKey = (findProperty('pinkPlayLicenseKey') ?: '').toString().trim()
if (storeBilling && playLicenseKey.isEmpty()) {
    throw new GradleException('pinkStoreBilling=true needs pinkPlayLicenseKey (the Play licensing key) in android/gradle.properties. See docs/google-play.md.')
}

android {
    namespace = "com.dancruz.pinkunicorn"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dancruz.pinkunicorn"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.0"
        buildConfigField 'boolean', 'PINK_STORE_BILLING', storeBilling.toString()
        buildConfigField 'String', 'PLAY_LICENSE_KEY', '"' + playLicenseKey + '"'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasUploadKey) {
                // A bare file name means the key sits next to the properties file.
                def keyFile = new File(keystoreProps.getProperty('storeFile'))
                storeFile keyFile.isAbsolute() ? keyFile : new File(keystorePropsFile.parentFile, keyFile.path)
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword') ?: keystoreProps.getProperty('storePassword')
            }
        }
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        release {
            if (hasUploadKey) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Google Play Billing. It adds the com.android.vending.BILLING permission, which Play Console needs to see in an
    // uploaded build before it lets anyone create products.
    implementation "com.android.billingclient:billing:$playBillingVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
