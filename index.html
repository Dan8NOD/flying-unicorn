<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff5fc4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Pink Unicorn</title>
<style>
  html,body{margin:0;height:100%;background:#2a0f3d;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  canvas{display:block;margin:auto;position:absolute;inset:0;max-width:100%;max-height:100%;background:#ffd6f0}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script src="game.js"></script>
<script src="net.js"></script>
<script>
  addEventListener('contextmenu', e => e.preventDefault());
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  // Go fullscreen on the first tap where the browser allows it (hides the Android address bar).
  addEventListener('pointerdown', () => { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {}); }, { once: true });
</script>
</body>
</html>
